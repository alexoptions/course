<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極速圖片標註畫板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #f8fafc; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden; user-select: none;
    }
    header {
      background: #1e293b; padding: 8px 16px; display: flex;
      align-items: center; justify-content: space-between;
      border-bottom: 1px solid #334155; gap: 12px; min-height: 64px;
    }
    .bar { display: flex; align-items: center; gap: 10px; }
    .color-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid #ffffff; cursor: pointer; transition: transform 0.1s ease;
    }
    .color-btn:active { transform: scale(0.92); }
    .color-btn.active { outline: 3px solid #38bdf8; }
    .btn {
      min-height: 48px; padding: 0 18px; font-size: 15px; font-weight: 600;
      border-radius: 8px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn-copy { background: #2563eb; color: #ffffff; }
    .btn-copy:hover { background: #1d4ed8; }
    .btn-clear { background: #334155; color: #e2e8f0; }
    .btn-clear:hover { background: #475569; }
    .hint { font-size: 12px; color: #94a3b8; line-height: 1.3; }
    .viewport {
      flex: 1; padding: 16px; display: flex;
      align-items: center; justify-content: center; background: #0f172a;
    }
    canvas {
      background: #ffffff; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      touch-action: none; cursor: crosshair;
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <button class="color-btn active" style="background:#ef4444" data-color="#ef4444" title="紅色"></button>
      <button class="color-btn" style="background:#2563eb" data-color="#2563eb" title="藍色"></button>
      <button class="color-btn" style="background:#0f172a" data-color="#0f172a" title="黑色"></button>
      <div class="hint">支援 Ctrl+V 貼上<br>或直接拖曳圖片入畫布</div>
    </div>
    <div class="bar">
      <button id="clearBtn" class="btn btn-clear">清空</button>
      <button id="copyBtn" class="btn btn-copy">📋 複製圖片</button>
    </div>
  </header>
  <div class="viewport">
    <canvas id="paintCanvas"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const colorBtns = document.querySelectorAll('.color-btn');
    let isDrawing = false;
    let currentColor = '#ef4444';

    function initCanvas() {
      const container = canvas.parentElement;
      canvas.width = Math.max(320, container.clientWidth - 32);
      canvas.height = Math.max(260, container.clientHeight - 32);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 4;
    }

    function renderImage(img) {
      const scale = Math.min((canvas.width - 32) / img.width, (canvas.height - 32) / img.height, 1);
      const w = img.width * scale;
      const h = img.height * scale;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const img = new Image();
      img.onload = () => renderImage(img);
      img.src = URL.createObjectURL(file);
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function startDraw(e) {
      isDrawing = true;
      const { x, y } = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!isDrawing) return;
      if (e.cancelable) e.preventDefault();
      const { x, y } = getCoords(e);
      ctx.strokeStyle = currentColor;
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function endDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', endDraw);

    window.addEventListener('paste', (e) => {
      const item = [...(e.clipboardData?.items || [])].find(i => i.type.includes('image'));
      if (item) handleFile(item.getAsFile());
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer?.files?.length) handleFile(e.dataTransfer.files[0]);
    });

    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        colorBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.dataset.color;
      });
    });

    clearBtn.addEventListener('click', () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    copyBtn.addEventListener('click', () => {
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        const orig = copyBtn.innerText;
        copyBtn.innerText = '✅ 已複製！';
        copyBtn.style.background = '#16a34a';
        setTimeout(() => {
          copyBtn.innerText = orig;
          copyBtn.style.background = '#2563eb';
        }, 1500);
      });
    });

    window.addEventListener('load', initCanvas);
  </script>
</body>
</html>
