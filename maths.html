<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover 讓 iPhone 瀏海螢幕完美顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心算訓練</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

        :root {
            --bg-color: #F4F8FB;       
            --surface: #FFFFFF;        
            --text-main: #2D3748;      
            --text-muted: #A0AEC0;
            --primary: #FF8F73;        
            --primary-hover: #FF7A59;
            --key-bg: #EDF2F7;         
            --correct: #48BB78;        
            --wrong: #FC8181;          
        }

        /* 針對 iPhone 的全面觸控最佳化 */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; /* 取消 iPhone 點擊時的灰色閃爍 */
            -webkit-touch-callout: none; /* 關閉長按彈出選單 */
        }

        body {
            font-family: 'Quicksand', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* 防止 iPhone 意外選取文字與放大 */
            -webkit-user-select: none; 
            user-select: none; 
            touch-action: manipulation; 
            color: var(--text-main);
        }

        .card {
            background-color: var(--surface);
            padding: 35px 25px;
            border-radius: 32px;
            box-shadow: 0 10px 40px rgba(45, 55, 72, 0.08);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        h1 { font-size: 2em; font-weight: 700; margin: 0 0 25px 0; }
        h2 { font-size: 1.8em; font-weight: 700; margin: 0 0 10px 0; }

        /* --- 設定畫面 --- */
        .setting-group {
            margin-bottom: 25px;
            text-align: left;
            background: #F8FAFC;
            padding: 15px;
            border-radius: 20px;
        }

        .setting-label {
            display: block;
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .toggle-container { display: flex; gap: 8px; }

        .toggle-btn {
            flex: 1;
            padding: 14px 4px;
            font-size: 0.9em;
            font-weight: 700;
            font-family: inherit;
            color: var(--text-muted);
            background: var(--surface);
            border: 2px solid transparent;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            touch-action: manipulation; /* 解決 iOS 點擊延遲 */
        }

        .toggle-btn.active {
            color: var(--primary);
            border-color: var(--primary);
            background: #FFF5F2;
            box-shadow: 0 4px 10px rgba(255, 143, 115, 0.15);
        }

        .start-btn {
            width: 100%;
            padding: 20px;
            margin-top: 10px;
            font-size: 1.4em;
            font-weight: 700;
            font-family: inherit;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-hover);
            touch-action: manipulation;
        }

        .start-btn:active { 
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--primary-hover); 
        }

        /* --- 測驗畫面 --- */
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 1.1em;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding: 0 10px;
        }

        .timer { color: var(--primary); font-variant-numeric: tabular-nums; }
        .question-display { font-size: 4em; font-weight: 700; margin: 10px 0 20px 0; }

        .answer-box {
            font-size: 2.5em;
            font-weight: 700;
            height: 75px;
            line-height: 70px;
            background-color: var(--key-bg);
            border: 4px solid var(--key-bg);
            border-radius: 20px;
            margin-bottom: 25px;
            transition: all 0.2s;
        }

        .answer-box.correct { border-color: var(--correct); background-color: #F0FFF4; color: var(--correct); }
        .answer-box.wrong { border-color: var(--wrong); background-color: #FFF5F5; color: var(--wrong); }

        /* --- 鍵盤 --- */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        .key {
            padding: 20px 0;
            font-size: 1.6em;
            font-weight: 700;
            font-family: inherit;
            color: var(--text-main);
            background-color: var(--key-bg);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #D2DCE6;
            touch-action: manipulation; /* 極致提升點擊反應速度 */
        }

        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #D2DCE6;
            background-color: #E2E8F0;
        }

        .key.delete { color: var(--wrong); font-size: 1.4em; }
        .key.enter {
            background-color: #48BB78;
            color: white;
            box-shadow: 0 4px 0 #38A169;
            grid-column: span 2;
        }
        .key.enter:active { box-shadow: 0 0 0 #38A169; }

        /* --- 結算畫面 --- */
        .emoji-result { font-size: 4em; margin-bottom: 10px; }
        .result-category {
            display: inline-block;
            background-color: var(--key-bg);
            color: var(--text-muted);
            font-size: 0.9em;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-item { background: #F8FAFC; padding: 20px 10px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; }
        .stat-label { font-size: 0.9em; font-weight: 700; color: var(--text-muted); }
        .stat-value { font-size: 1.8em; font-weight: 700; color: var(--text-main); }
        .stat-value.green { color: var(--correct); }
        .hidden { display: none !important; }

    </style>
</head>
<body>

<div class="card">
    <div id="start-screen">
        <h1>✨ 心算訓練 ✨</h1>
        <div class="setting-group">
            <span class="setting-label">想練習什麼？</span>
            <div class="toggle-container">
                <button class="toggle-btn active" onclick="setMode('op', 'add', this)">加法 (+)</button>
                <button class="toggle-btn" onclick="setMode('op', 'sub', this)">減法 (-)</button>
                <button class="toggle-btn" onclick="setMode('op', 'mix', this)">混合</button>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label">難易度</span>
            <div class="toggle-container">
                <button class="toggle-btn active" onclick="setMode('dig', 2, this)">初級 (兩位數)</button>
                <button class="toggle-btn" onclick="setMode('dig', 3, this)">進階 (三位數)</button>
            </div>
        </div>
        <button class="start-btn" onclick="startQuiz()">開始挑戰！🚀</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="header">
            <span id="progress">1 / 10</span>
            <span id="timer" class="timer">0.0s</span>
        </div>
        <div id="question" class="question-display">0 + 0</div>
        <div id="answer-box" class="answer-box"></div>
        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key delete" onclick="deleteKey()">⌫</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key enter" onclick="submitAnswer()">確認</button>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="emoji-result" id="result-emoji">🌟</div>
        <h2 id="result-title">表現很好！</h2>
        <div class="result-category" id="result-category">加法 (+) • 初級 (兩位數)</div>
        <div class="stat-grid">
            <div class="stat-item">
                <span class="stat-label">得分</span>
                <span class="stat-value green" id="final-score">10/10</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">耗時</span>
                <span class="stat-value" id="final-time">0.0s</span>
            </div>
        </div>
        <button class="start-btn" onclick="showStartScreen()">再玩一次 🔄</button>
    </div>
</div>

<script>
    let config = { op: 'add', dig: 2 };
    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let currentInput = "";
    let startTime = 0;
    let timerInterval = null;
    let isProcessing = false;

    const opNames = { 'add': '加法 (+)', 'sub': '減法 (-)', 'mix': '混合 (+/-)' };
    const digNames = { 2: '初級 (兩位數)', 3: '進階 (三位數)' };

    function setMode(type, value, btnElement) {
        config[type] = value;
        let siblings = btnElement.parentElement.children;
        for (let btn of siblings) btn.classList.remove('active');
        btnElement.classList.add('active');
    }

    function showStartScreen() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function getRandom(digits) {
        let min = digits === 2 ? 10 : 100;
        let max = digits === 2 ? 99 : 999;
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions() {
        questions = [];
        for (let i = 0; i < 10; i++) {
            let num1 = getRandom(config.dig);
            let num2 = getRandom(config.dig);
            let currentOp = config.op === 'mix' ? (Math.random() > 0.5 ? 'add' : 'sub') : config.op;

            if (currentOp === 'sub') {
                if (num2 > num1) [num1, num2] = [num2, num1];
                questions.push({ q: `${num1} - ${num2}`, a: num1 - num2 });
            } else {
                questions.push({ q: `${num1} + ${num2}`, a: num1 + num2 });
            }
        }
    }

    function startQuiz() {
        generateQuestions();
        currentIdx = 0;
        score = 0;
        currentInput = "";
        isProcessing = false;
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        showQuestion();
        startTime = Date.now();
        timerInterval = setInterval(() => {
            document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
        }, 100);
    }

    function showQuestion() {
        document.getElementById('progress').innerText = `${currentIdx + 1} / 10`;
        document.getElementById('question').innerText = questions[currentIdx].q;
        currentInput = "";
        document.getElementById('answer-box').className = 'answer-box';
        updateAnswerDisplay();
    }

    function pressKey(num) {
        if (!isProcessing && currentInput.length < 4) {
            currentInput += num;
            updateAnswerDisplay();
        }
    }

    function deleteKey() {
        if (!isProcessing) {
            currentInput = currentInput.slice(0, -1);
            updateAnswerDisplay();
        }
    }

    function updateAnswerDisplay() {
        document.getElementById('answer-box').innerText = currentInput;
    }

    function submitAnswer() {
        if (currentInput === "" || isProcessing) return;
        isProcessing = true; 

        let ansBox = document.getElementById('answer-box');
        if (parseInt(currentInput) === questions[currentIdx].a) {
            score++;
            ansBox.classList.add('correct');
        } else {
            ansBox.classList.add('wrong');
            ansBox.innerText = questions[currentIdx].a; 
        }

        setTimeout(() => {
            currentIdx++;
            if (currentIdx < questions.length) {
                showQuestion();
                isProcessing = false;
            } else {
                finishQuiz();
            }
        }, 400);
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score}/10`;
        document.getElementById('final-time').innerText = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
        document.getElementById('result-category').innerText = `${opNames[config.op]} • ${digNames[config.dig]}`;
        
        let title = document.getElementById('result-title');
        let emoji = document.getElementById('result-emoji');
        
        if (score === 10) { title.innerText = "太棒了！滿分！"; emoji.innerText = "🏆"; } 
        else if (score >= 7) { title.innerText = "表現很好！"; emoji.innerText = "🌟"; } 
        else { title.innerText = "繼續加油！"; emoji.innerText = "👍"; }
    }
</script>
</body>
</html>
